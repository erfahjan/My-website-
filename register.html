<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title> 
       <style>
 *{margin: 0%;
    padding: auto;
box-sizing: border-box;
        }
body{
    min-height: 100vh;
    background-image: url("thanks.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center

}
.login.box {
    width: min(100%, 500px);
    padding: clamp(20px, 5vw, 30px);
    text-align: center;
    border: 2px solid rgba(45, 72, 173, 0.5);
    border-radius: 15px;
    background-color: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
}
.login.box h1 {
    margin: 14px 0;
    color: white;
    font-size: clamp(16px, 2.4vw, 21px);
    font-weight: 600;
}
.login.box input {
    width: min(100%, 310px);
    padding: 10px;
    margin: 8px 0 0 8px;
    border: none;
    border-radius: 8px;
    outline: none;
}
.login.box button{
    cursor: pointer;
    color: rgb(177, 216, 104);
}

@media (max-width: 600px) {
    .login.box h1 {
        text-align: left;
    }

    .login.box input {
        display: block;
        width: 100%;
        margin: 8px 0 0;
    }
}

    </style>
</head>
<body>
    
    <div class="login box">

        <h2 style="color: white; font-size: 30px; text-align: center;">
            sign up
        </h2>
     <h1>first name:   <input type="text" placeholder="First Name"></h1><br>
     <h1>last name:   <input type="text" placeholder="Last Name"></h1><br>
     <h1>Email/ph.: <input type="text" placeholder="Enter Email or phone number"></h1><br>
        <h1>Password: <input type="password" placeholder=" create password"><br>
        <button style="height: 30px; width: 30%; color: rgb(68, 68, 156); background-color: rgba(101, 219, 107, 0.656);  border-radius: 8px; cursor: pointer;
        margin-top: 20px;" ><a href="home.html">sign up</a></button><br>


    
</body>
</html>
